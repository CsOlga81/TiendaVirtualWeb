<!DOCTYPE html>
<html>
    <head>
        <title>Tienda Virtual</title>
        <meta charset=UTF-8">
    </head>
    <body>
        <h1>Registro del Cliente</h1>
        
        <form action="ClienteServlet" method="post" accept-charset="UTF-8">
            
            <label>Nombre:</label><br>
            <input type="text" name="nombre" placeholder = "Nombre" required=""><br><br> 
            
            <label>Correo:</label><br>
            <input type="email" name="correo" placeholder="Correo" required=""><br><br>
            
            <label>Telefono:</label><br>
            <input type="text" name="telefono" placeholder="Telefono" required=""><br><br>
            
            <input type="submit" value="Registrar">
        </form>
    </body>
</html>
